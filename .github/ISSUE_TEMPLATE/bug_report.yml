name: Bug report
description: Report a problem with the Tesla Drive Tracker integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a report. Issues here are public, and drive data shows
        where you go, so please remove coordinates, addresses and your VIN from
        anything you paste.
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: From HACS, or the `version` field in `manifest.json`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.x.x"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Home Assistant logs
      description: >
        Relevant lines from Settings → System → Logs (or `home-assistant.log`).
        Enable debug logging for `custom_components.tesla_drive_tracker` first
        if you can.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: I have read the README.
          required: true
        - label: I have searched existing issues for this problem.
          required: true
