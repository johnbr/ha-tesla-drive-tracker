version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    cooldown:
      default-days: 7
    ignore:
      # TypeScript 7 has no JavaScript compiler API, which
      # @rollup/plugin-typescript needs, so `npm run build` crashes on load.
      # Lift this when the plugin supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    cooldown:
      default-days: 7
    groups:
      # init and analyze must run the same version, or CodeQL refuses to run
      codeql-action:
        patterns:
          - "github/codeql-action*"
